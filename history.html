<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f8b8d">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
  <title>Riwayat Checklist</title>
  <link rel="stylesheet" href="styles.css?v=3">
  <script defer src="config.js"></script>
  <script defer src="auth.js"></script>
  <script defer src="history.js"></script>
</head>
<body>
  <header>
    <div class="header-title">Riwayat Pengiriman Checklist</div>
    <div class="header-subtitle">Pantau data terkirim, lihat detail, dan kelola riwayat dengan cepat.</div>
  </header>

  <main class="container">
    <section class="panel">
      <div class="meta-grid">
        <div class="field col-3">
          <label for="filterNipp">Filter NIPP</label>
          <input type="text" id="filterNipp" placeholder="Contoh: 123456">
        </div>
        <div class="field col-3">
          <label for="filterLokasi">Filter Lokasi</label>
          <input type="text" id="filterLokasi" placeholder="Contoh: Tebing Tinggi">
        </div>
        <div class="field col-3">
          <label for="filterLimit">Jumlah Data</label>
          <input type="number" id="filterLimit" min="1" max="200" value="50">
        </div>
        <div class="field col-3 history-action-row">
          <button class="btn btn-blue" type="button" id="btnMuatRiwayat">Cari</button>
          <button class="btn btn-gray" type="button" id="btnResetFilter">Reset Filter</button>
          <a class="btn btn-gray" href="index.html">Kembali</a>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Waktu</th>
              <th>Petugas</th>
              <th>NIPP</th>
              <th>Lokasi/Stasiun</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>

      <div class="hint" id="historyHint">Belum ada data ditampilkan.</div>
      <div class="history-detail" id="historyDetail">Pilih Detail untuk melihat payload kiriman.</div>
    </section>
  </main>
</body>
</html>
