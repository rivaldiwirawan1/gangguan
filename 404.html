<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Halaman Tidak Ditemukan</title>
  <style>
    :root {
      color-scheme: light;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(140deg, #eef7f3, #d8ecf9);
      color: #133041;
    }
    .card {
      width: min(560px, 92vw);
      background: #ffffff;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 14px 35px rgba(19, 48, 65, 0.12);
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 42px;
    }
    p {
      margin: 6px 0;
      color: #5a7280;
    }
    a {
      display: inline-block;
      margin-top: 16px;
      color: #ffffff;
      text-decoration: none;
      background: linear-gradient(115deg, #1d3557, #277da1);
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>404</h1>
    <p>Halaman yang Anda cari tidak ditemukan.</p>
    <p>Periksa kembali alamat URL atau kembali ke halaman utama.</p>
    <a href="/">Kembali ke Beranda</a>
  </main>
</body>
</html>
